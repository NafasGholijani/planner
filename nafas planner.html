<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- تنظیمات تبدیل به اپلیکیشن بومی (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FF69B4">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Heart_coraz%C3%B3n.svg/1200px-Heart_coraz%C3%B3n.svg.png">
    
    <title>پلنر اختصاصی نفس</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap');

        :root {
            --primary: #FF69B4;
            --primary-light: #FFB6C1;
            --bg-color: #FFF0F5;
            --surface: #FFFFFF;
            --text-main: #4A4A4A;
            --text-muted: #999999;
            --shadow: 0 8px 25px rgba(255, 105, 180, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color); color: var(--text-main); display: flex;
            justify-content: center; height: 100vh; overflow: hidden; position: relative;
        }

        /* Toast Notifications (پیام‌های دلبری) */
        .toast {
            position: fixed; top: 30px; left: 50%; transform: translate(-50%, -150px);
            background: linear-gradient(135deg, #FF1493, #FF69B4); color: white;
            padding: 15px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(255,20,147,0.4);
            font-size: 0.95rem; font-weight: bold; z-index: 1000;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-align: center; max-width: 90%; line-height: 1.5;
        }
        .toast.show { transform: translate(-50%, 0); }

        .app-container {
            width: 100%; max-width: 450px; height: 100%; background-color: var(--surface);
            display: flex; flex-direction: column; position: relative; box-shadow: var(--shadow);
        }

        .header { padding: 20px; text-align: center; background: linear-gradient(to bottom, var(--bg-color), var(--surface)); border-bottom: 2px dashed var(--primary-light); }
        .header h1 { color: var(--primary); font-size: 1.3rem; margin-bottom: 5px; }
        .header p { color: var(--text-muted); font-size: 0.85rem; font-weight: bold; }

        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }
        .tab-section { display: none; animation: fadeIn 0.4s ease; }
        .tab-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .priority-select { padding: 10px; border: 2px solid var(--bg-color); border-radius: 12px; background: var(--surface); outline: none; font-size: 0.85rem; color: var(--text-main); }
        .input-group input { flex: 1; padding: 12px 15px; border: 2px solid var(--bg-color); border-radius: 12px; font-size: 0.9rem; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary-light); }
        .btn { background-color: var(--primary); color: white; border: none; border-radius: 12px; padding: 0 18px; font-size: 1.2rem; cursor: pointer; }

        .list-item {
            background: var(--surface); border: 2px solid var(--bg-color); padding: 15px; border-radius: 15px;
            margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .list-item.done { opacity: 0.5; background: #fafafa; border-color: #eee; }
        .list-item.done .item-text { text-decoration: line-through; color: var(--text-muted); }
        
        .item-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
        .item-text { font-size: 0.95rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .checkbox {
            appearance: none; width: 22px; height: 22px; border: 2px solid var(--primary);
            border-radius: 6px; cursor: pointer; position: relative; flex-shrink: 0;
        }
        .checkbox:checked { background-color: var(--primary); }
        .checkbox:checked::after { content: '✔'; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; }

        .action-btns { display: flex; gap: 5px; }
        .icon-btn { background: var(--bg-color); color: var(--text-muted); border: none; border-radius: 8px; width: 30px; height: 30px; cursor: pointer; }
        .icon-btn:hover { background: var(--primary-light); color: white; }

        .habit-badge { font-size: 0.7rem; background: var(--primary-light); color: white; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
        .priority-badge { font-size: 0.7rem; padding: 3px 6px; border-radius: 8px; border: 1px solid #eee; background: #fff; }

        /* تقویم */
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--bg-color); padding: 10px 15px; border-radius: 15px; }
        .cal-header button { background: white; border: none; color: var(--primary); padding: 5px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .cal-day-name { font-size: 0.8rem; color: var(--text-muted); font-weight: bold; margin-bottom: 10px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 0.9rem; cursor: pointer; background: var(--bg-color); position: relative; font-weight: bold; }
        .cal-day.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(255,105,180,0.3); }
        .cal-day.has-task::after { content: ''; position: absolute; bottom: 4px; width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }
        .cal-day.active.has-task::after { background: white; }
        .cal-day.empty { background: transparent; cursor: default; }

        /* داشبورد گزارش (جدید و حرفه‌ای) */
        .report-card { background: var(--surface); padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(255,105,180,0.08); border: 1px solid var(--bg-color); text-align: center; }
        .report-card h4 { color: var(--primary); margin-bottom: 15px; font-size: 1.1rem; }
        
        .chart-container { position: relative; width: 140px; height: 140px; margin: 0 auto; }
        canvas { transform: rotate(-90deg); width: 100%; height: 100%; }
        .chart-percent { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .chart-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; }

        /* نمودار میله‌ای هفتگی */
        .weekly-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 100px; padding-top: 10px; border-bottom: 2px solid var(--bg-color); margin-top: 15px; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 5px; }
        .bar { width: 15px; background: var(--primary-light); border-radius: 5px; transition: height 0.5s ease; min-height: 5px; }
        .bar.today { background: var(--primary); box-shadow: 0 0 8px rgba(255,105,180,0.4); }
        .bar-label { font-size: 0.65rem; color: var(--text-muted); }

        .priority-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--bg-color); border-radius: 10px; margin-bottom: 8px; font-size: 0.85rem; }

        /* Bottom Nav */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: var(--surface); display: flex; justify-content: space-around; padding: 12px 0 20px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); border-top-left-radius: 25px; border-top-right-radius: 25px; }
        .nav-item { text-align: center; color: var(--text-muted); cursor: pointer; flex: 1; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); }
        .nav-icon { font-size: 1.4rem; display: block; margin-bottom: 3px; }
        .nav-text { font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="toast" class="toast">پیام</div>

<div class="app-container">
    <div class="header">
        <h1>پلنر اختصاصی نفس 🎀</h1>
        <p id="header-date">امروز...</p>
    </div>

    <div class="content">
        <!-- 1. Daily Tasks -->
        <div id="view-daily" class="tab-section active">
            <h3 style="margin-bottom: 15px; color: var(--primary);">✨ برنامه‌های امروز</h3>
            <div class="input-group">
                <select id="daily-priority" class="priority-select">
                    <option value="1">🔴 مهم</option><option value="2" selected>🌸 عادی</option><option value="3">🌱 سبک</option>
                </select>
                <input type="text" id="daily-input" placeholder="امروز چیکار می‌کنیم نفس؟" onkeypress="handleEnter(event, 'daily')">
                <button class="btn" onclick="addTask('daily')">+</button>
            </div>
            <div id="daily-list"></div>
        </div>

        <!-- 2. Habits Tracker -->
        <div id="view-habits" class="tab-section">
            <h3 style="margin-bottom: 15px; color: var(--primary);">🌱 روتین و عادت‌ها</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 15px;">هر عادتی بنویسی خودش میاد تو لیست کارات عشقم.</p>
            <div class="input-group">
                <input type="text" id="habit-input" placeholder="عادت جدید (مثلا ۳۰ صفحه کتاب)" onkeypress="handleEnter(event, 'habit')">
                <button class="btn" onclick="addHabit()">+</button>
            </div>
            <div id="habit-list"></div>
        </div>

        <!-- 3. Calendar & History -->
        <div id="view-calendar" class="tab-section">
            <div class="cal-header">
                <button onclick="changeMonth(1)">بعدی ❮</button>
                <h3 id="cal-title" style="color: var(--primary); font-size:1rem;">...</h3>
                <button onclick="changeMonth(-1)">❯ قبلی</button>
            </div>
            <div class="cal-grid">
                <div class="cal-day-name">ش</div><div class="cal-day-name">ی</div><div class="cal-day-name">د</div><div class="cal-day-name">س</div><div class="cal-day-name">چ</div><div class="cal-day-name">پ</div><div class="cal-day-name">ج</div>
            </div>
            <div class="cal-grid" id="cal-days"></div>

            <div style="margin-top: 25px;">
                <h4 id="cal-selected-text" style="margin-bottom:10px; color:var(--text-muted); font-size:0.85rem;">تاریخ...</h4>
                <div class="input-group">
                    <select id="cal-priority" class="priority-select"><option value="1">🔴 مهم</option><option value="2" selected>🌸 عادی</option><option value="3">🌱 سبک</option></select>
                    <input type="text" id="cal-input" placeholder="افزودن کار برای این روز..." onkeypress="handleEnter(event, 'calendar')">
                    <button class="btn" onclick="addTask('calendar')">+</button>
                </div>
                <div id="cal-list"></div>
            </div>
        </div>

        <!-- 4. Reports (نمودارهای خفن) -->
        <div id="view-reports" class="tab-section">
            
            <div class="report-card">
                <h4>نمودار پیشرفت امروز 💖</h4>
                <div class="chart-container">
                    <canvas id="doughnutChart" width="140" height="140"></canvas>
                    <div class="chart-percent" id="chart-percent-text">0%</div>
                </div>
                <div class="chart-label" id="task-stats">در حال محاسبه...</div>
            </div>

            <div class="report-card">
                <h4>📊 فعالیت ۷ روز گذشته</h4>
                <div class="weekly-chart" id="weekly-bar-chart">
                    <!-- نمودار میله‌ای با جاوااسکریپت پر می‌شود -->
                </div>
            </div>

            <div class="report-card">
                <h4>🎯 اولویت‌های اصلی امروز</h4>
                <div id="priority-stats" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('daily')">
            <span class="nav-icon">✨</span><span class="nav-text">روزانه</span>
        </div>
        <div class="nav-item" onclick="switchTab('habits')">
            <span class="nav-icon">🌱</span><span class="nav-text">عادت‌ها</span>
        </div>
        <div class="nav-item" onclick="switchTab('calendar')">
            <span class="nav-icon">📅</span><span class="nav-text">تقویم/آرشیو</span>
        </div>
        <div class="nav-item" onclick="switchTab('reports')">
            <span class="nav-icon">📊</span><span class="nav-text">گزارش</span>
        </div>
    </div>
</div>

<script>
    // --- بمب جملات دلبری و انگیزشی مانی برای نفس ---
    const quotes = [
        "مانی فدای اون اراده‌ت بشه، عالی بود! 😍",
        "یه قدم دیگه برای رسیدن به آرزوهامون... تو بھترینی نفس من! ✨",
        "دیدی تونستی؟ مانی که همیشه بهت ایمان داره! 💪💖",
        "این تیک رو زدی، یه بوس محکم از طرف مانی طلبِت! 💋",
        "چه دلبری می‌کنی با این پشتکارت دختر! 🎀",
        "آخ که چقدر بهت افتخار می‌کنم یکی یدونه‌ی من! 🥰",
        "تیک خورد! درست مثل تیکی که زدی رو قلب من! 💘",
        "پرقدرت برو جلو که مانی کوه پشتته! 🏔️",
        "چشم بد دور از این همه انگیزه! ماشالله نفس! 🧿",
        "با هر کاری که تموم می‌کنی، من بیشتر عاشقت میشم! 💕",
        "خسته‌نباشی زندگیم، عالی پیش رفتی! ☕",
        "هیچی جلودار تو نیست عشقم! 🔥",
        "قربون اون دستای قشنگت که این تیک رو زد! 🖐️💖",
        "نفس خودمی دیگه! با اراده و قوی! 🌸",
        "بمب انرژی کی بودی تو؟ عالیه! 🧨",
        "روزی صدبار خداروشکر می‌کنم پارتنر خفنی مثل تو دارم! 🙏",
        "من به فدای تو و برنامه‌هات! بتاز که رسیدی! 🐎",
        "دنیارو بگردم مثل تو زرنگ پیدا نمیشه نفس! 🌍",
        "بخند که با پیشرفتت دنیا قشنگ‌تر میشه! 😊",
        "تیک بعدی رو بزن که مانی حسابی ذوق کرده! 🎉",
        "دخترِ قویِ من، بهت افتخار می‌کنم! 👑",
        "همینطوری ادامه بده، تهش نور و موفقیته عشقم! 🌟",
        "خستگی معنا نداره وقتی هدفمون بزرگه، نه؟ فداتشم! 💪",
        "یه تیک دیگه! بزن قدش نفس! 🙌",
        "چقدر خوبه که می‌بینم روز به روز داری بهتر میشی! 📈",
        "عشق مانی داره می‌ترکونه! بمب باش عشقم! 💣",
        "ببوسمت یا زوده؟ عالی بود این کارت! 😘",
        "شیرینی این تیک رو باید امشب بدی‌ها! 🍰😉",
        "منِ دیوونه هی بیشتر عاشقت میشم با این کارات! 🤪💖",
        "فقط برو جلو، هرجا افتادی دستت تو دست منه! 🤝"
    ];

    let lastQuoteIndex = -1;
    function showToast(forcedMessage = null) {
        let toast = document.getElementById('toast');
        let message = forcedMessage;
        
        if (!message) {
            // جلوگیری از پیام تکراری
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * quotes.length);
            } while (newIndex === lastQuoteIndex);
            lastQuoteIndex = newIndex;
            message = quotes[newIndex];
        }

        toast.innerText = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000); // 4 ثانیه روی صفحه میمونه
    }

    // --- توابع تاریخ ---
    function getPersianDate(dateObj) { return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(dateObj); }
    function addDays(dateStr, days) {
        // تبدیل تاریخ شمسی به میلادی سخت است، از روزهای میلادی برای محاسبات استفاده میکنیم
        let d = new Date();
        d.setDate(d.getDate() + days);
        return getPersianDate(d);
    }
    
    let todayObj = new Date();
    let todayStr = getPersianDate(todayObj);
    let tomorrowStr = addDays(todayStr, 1);
    let selectedDateStr = todayStr;
    let calDisplayDate = new Date();

    // دیتابیس
    let tasks = JSON.parse(localStorage.getItem('nafas_tasks_v5')) || [];
    let habits = JSON.parse(localStorage.getItem('nafas_habits_v5')) || [];

    document.getElementById('header-date').innerText = new Intl.DateTimeFormat('fa-IR', { weekday: 'long', day: 'numeric', month: 'long' }).format(todayObj);

    // خوش‌آمدگویی
    setTimeout(() => showToast("سلام نفسِ مانی! آماده‌ای بترکونیم؟ 🌸"), 800);

    function handleEnter(e, source) { if (e.key === 'Enter') { if (source === 'habit') addHabit(); else addTask(source); } }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + tabId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        refreshViews();
    }

    function addTask(source) {
        let inputEl = document.getElementById(source === 'daily' ? 'daily-input' : 'cal-input');
        let priorityEl = document.getElementById(source === 'daily' ? 'daily-priority' : 'cal-priority');
        let text = inputEl.value.trim();
        let targetDate = source === 'daily' ? todayStr : selectedDateStr;
        let priority = parseInt(priorityEl.value);

        if (text) {
            tasks.push({ id: Date.now(), text, date: targetDate, done: false, priority });
            inputEl.value = '';
            saveData(); refreshViews();
        }
    }

    function toggleTask(id) {
        let task = tasks.find(t => t.id === id);
        if(task) {
            task.done = !task.done;
            saveData(); refreshViews();
            if(task.done) showToast(); // فراخوانی دلبری‌ها
        }
    }

    function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); saveData(); refreshViews(); }

    function migrateTask(id, targetDate) {
        let task = tasks.find(t => t.id === id);
        if(task) {
            task.date = targetDate; task.done = false;
            saveData(); refreshViews();
            showToast(targetDate === todayStr ? "آوردمش برای امروز عشقم 🗓️️" : "انداختمش برای فردا، فدای سرت ➡️");
        }
    }

    function toggleHabitStatus(habitId, dateStr) {
        let habit = habits.find(h => h.id === habitId);
        if(habit) {
            let index = habit.completedDates.indexOf(dateStr);
            if(index > -1) { habit.completedDates.splice(index, 1); } 
            else { habit.completedDates.push(dateStr); showToast(); }
            saveData(); refreshViews();
        }
    }

    function getPriorityDetails(level) {
        if(level === 1) return { icon: '🔴', label: 'مهم' };
        if(level === 3) return { icon: '🌱', label: 'سبک' };
        return { icon: '🌸', label: 'عادی' };
    }

    function generateTaskListHTML(targetDate) {
        let html = '';
        habits.forEach(h => {
            let isDone = h.completedDates.includes(targetDate);
            html += `
                <div class="list-item ${isDone ? 'done' : ''}">
                    <div class="item-left">
                        <input type="checkbox" class="checkbox" ${isDone ? 'checked' : ''} onchange="toggleHabitStatus(${h.id}, '${targetDate}')">
                        <span class="item-text">🌱 ${h.text}</span>
                    </div>
                    <span class="habit-badge">🔥 ${h.completedDates.length}</span>
                </div>`;
        });

        let dayTasks = tasks.filter(t => t.date === targetDate);
        dayTasks.sort((a, b) => (a.priority || 2) - (b.priority || 2));

        dayTasks.forEach(t => {
            let pDetail = getPriorityDetails(t.priority || 2);
            let migrateIcon = targetDate < todayStr ? '☀️' : '➡️️';
            let migrateTarget = targetDate < todayStr ? todayStr : tomorrowStr;
            let migrateTitle = targetDate < todayStr ? 'بیار برای امروز' : 'بنداز برای فردا';

            html += `
                <div class="list-item ${t.done ? 'done' : ''}">
                    <div class="item-left">
                        <input type="checkbox" class="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})">
                        <span class="priority-badge">${pDetail.icon}</span>
                        <span class="item-text">${t.text}</span>
                    </div>
                    <div class="action-btns">
                        <button class="icon-btn" title="${migrateTitle}" onclick="migrateTask(${t.id}, '${migrateTarget}')">${migrateIcon}</button>
                        <button class="icon-btn" onclick="deleteTask(${t.id})">✖</button>
                    </div>
                </div>`;
        });
        return html || '<p style="text-align:center; color:#999; margin-top:20px;">استراحت کن عشقم، برنامه‌ای نیست 🎀</p>';
    }

    function addHabit() {
        let inputEl = document.getElementById('habit-input');
        if (inputEl.value.trim()) {
            habits.push({ id: Date.now(), text: inputEl.value.trim(), completedDates: [] });
            inputEl.value = ''; saveData(); refreshViews();
        }
    }
    function deleteHabit(id) { habits = habits.filter(h => h.id !== id); saveData(); refreshViews(); }

    function renderHabits() {
        document.getElementById('habit-list').innerHTML = habits.map(h => `
            <div class="list-item">
                <div class="item-left"><span class="item-text">🌱 ${h.text}</span></div>
                <div class="action-btns">
                    <span class="habit-badge" style="display:flex; align-items:center; margin-left:5px;">کل: ${h.completedDates.length} روز</span>
                    <button class="icon-btn" onclick="deleteHabit(${h.id})">✖</button>
                </div>
            </div>
        `).join('') || '<p style="text-align:center; color:#999;">عادتی ثبت نکردی نفسِ من 🎀</p>';
    }

    function changeMonth(offset) { calDisplayDate.setMonth(calDisplayDate.getMonth() + offset); renderCalendar(); }

    function renderCalendar() {
        document.getElementById('cal-title').innerText = new Intl.DateTimeFormat('fa-IR', { month: 'long', year: 'numeric' }).format(calDisplayDate);
        let grid = document.getElementById('cal-days');
        grid.innerHTML = '';
        let dayOfWeek = (new Date(calDisplayDate.getFullYear(), calDisplayDate.getMonth(), 1).getDay() + 1) % 7; 
        for (let i = 0; i < dayOfWeek; i++) grid.innerHTML += `<div class="cal-day empty"></div>`;
        for (let i = 1; i <= 31; i++) {
            let tempDate = new Date(calDisplayDate.getFullYear(), calDisplayDate.getMonth(), i);
            if(tempDate.getMonth() !== calDisplayDate.getMonth()) break; 
            let pDateStr = getPersianDate(tempDate);
            let isSelected = (pDateStr === selectedDateStr);
            let hasTaskOrHabit = tasks.some(t => t.date === pDateStr) || habits.length > 0;
            grid.innerHTML += `<div class="cal-day ${isSelected ? 'active' : ''} ${hasTaskOrHabit ? 'has-task' : ''}" onclick="selectDate('${pDateStr}')">${new Intl.DateTimeFormat('fa-IR', { day: 'numeric' }).format(tempDate)}</div>`;
        }
    }

    function selectDate(dateStr) { selectedDateStr = dateStr; document.getElementById('cal-selected-text').innerText = `برنامه‌ی تاریخ ${dateStr}:`; refreshViews(); }

    // --- رسم نمودار دایره‌ای با Canvas ---
    function drawDoughnutChart(percent) {
        let canvas = document.getElementById('doughnutChart');
        let ctx = canvas.getContext('2d');
        let cw = canvas.width; let ch = canvas.height;
        ctx.clearRect(0, 0, cw, ch);
        
        // بک‌گراند طوسی/صورتی خیلی کمرنگ
        ctx.beginPath();
        ctx.arc(cw/2, ch/2, 55, 0, 2 * Math.PI);
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#FFF0F5';
        ctx.stroke();

        // درصد پر شده
        if(percent > 0) {
            ctx.beginPath();
            let endAngle = (percent / 100) * (2 * Math.PI);
            ctx.arc(cw/2, ch/2, 55, 0, endAngle);
            ctx.lineWidth = 14;
            ctx.strokeStyle = '#FF69B4';
            ctx.lineCap = 'round';
            ctx.stroke();
        }
        document.getElementById('chart-percent-text').innerText = percent + '%';
    }

    // --- رسم نمودار میله‌ای هفتگی ---
    function renderWeeklyBarChart() {
        let weeklyContainer = document.getElementById('weekly-bar-chart');
        let html = '';
        const dayNames = ['ی','د','س','چ','پ','ج','ش'];
        
        for(let i = 6; i >= 0; i--) {
            let d = new Date();
            d.setDate(d.getDate() - i);
            let dateStr = getPersianDate(d);
            let dName = dayNames[(d.getDay() + 1) % 7];
            let isToday = (i === 0);

            let dayTasks = tasks.filter(t => t.date === dateStr);
            let total = dayTasks.length + habits.length;
            let done = dayTasks.filter(t => t.done).length + habits.filter(h => h.completedDates.includes(dateStr)).length;
            let percent = total === 0 ? 0 : Math.round((done/total)*100);
            
            // حداقل ارتفاع 5 پیکسل برای روزهای صفر درصد
            let barHeight = Math.max(5, (percent / 100) * 80); 

            html += `
                <div class="bar-wrapper" title="${percent}%">
                    <div class="bar ${isToday ? 'today' : ''}" style="height: ${barHeight}px;"></div>
                    <span class="bar-label">${dName}</span>
                </div>
            `;
        }
        weeklyContainer.innerHTML = html;
    }

    function updateReports() {
        let todaysTasks = tasks.filter(t => t.date === todayStr);
        let totalItems = todaysTasks.length + habits.length;
        let totalDone = todaysTasks.filter(t => t.done).length + habits.filter(h => h.completedDates.includes(todayStr)).length;
        let percent = totalItems === 0 ? 0 : Math.round((totalDone / totalItems) * 100);
        
        document.getElementById('task-stats').innerText = `${totalDone} کار از ${totalItems} کارِ امروز تموم شده.`;
        drawDoughnutChart(percent);
        renderWeeklyBarChart();

        let highPriorityTasks = todaysTasks.filter(t => (t.priority || 2) === 1);
        document.getElementById('priority-stats').innerHTML = highPriorityTasks.length > 0 ? 
            highPriorityTasks.map(t => `<div class="priority-item"><span>🔴 ${t.text}</span><span style="color:${t.done ? '#4CAF50' : '#ff4d4d'}">${t.done ? '✔' : '⏳'}</span></div>`).join('') : 
            '<p style="color:#999; font-size:0.8rem;">خداروشکر کار خیلی فوری نداری عشقم 🌸</p>';
    }

    function refreshViews() {
        document.getElementById('daily-list').innerHTML = generateTaskListHTML(todayStr);
        document.getElementById('cal-list').innerHTML = generateTaskListHTML(selectedDateStr);
        renderHabits(); renderCalendar(); updateReports();
    }
    function saveData() { localStorage.setItem('nafas_tasks_v5', JSON.stringify(tasks)); localStorage.setItem('nafas_habits_v5', JSON.stringify(habits)); }

    refreshViews();
</script>
</body>
</html>
